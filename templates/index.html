<!DOCTYPE html>
<html>
<head>
    <title>AutoJudge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>AutoJudge – Problem Difficulty Predictor</h1>

    <form method="POST">
        <textarea name="description" placeholder="Problem Description" required></textarea>
        <textarea name="input_desc" placeholder="Input Description" required></textarea>
        <textarea name="output_desc" placeholder="Output Description" required></textarea>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <div class="result">
            <h2>Prediction</h2>
            <p><b>Difficulty:</b> {{ prediction.class }}</p>
            <p><b>Score:</b> {{ prediction.score }}</p>
        </div>
    {% endif %}
</body>
</html>
